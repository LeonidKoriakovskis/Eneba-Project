services:
  - type: web
    name: eneba-marketplace-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false # Paste Neon or Supabase PostgreSQL connection string (?sslmode=require)
      - key: ALLOWED_ORIGINS
        sync: false # e.g. https://your-vercel-app.vercel.app,http://localhost:5173
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_HOURS
        value: 72
